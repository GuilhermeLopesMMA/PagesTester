<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gargantua · Buraco Negro</title>
<link rel="shortcut icon" href="media/icons/blackhole.ico" type="image/x-icon">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #ui {
        position: fixed; inset: 0; pointer-events: none;
        font-family: 'Courier New', monospace;
    }

    #title { position: absolute; top: 32px; left: 40px; }
    #title h1 {
        font-size: 34px; font-weight: 300; letter-spacing: 10px;
        color: #ff9940;
        text-shadow: 0 0 20px rgba(255,150,50,.8), 0 0 60px rgba(255,80,0,.35);
    }
    #title .sub { font-size: 10px; letter-spacing: 4px; color: #555; margin-top: 8px; }

    #telem {
        position: absolute; bottom: 32px; left: 40px;
        font-size: 10px; letter-spacing: 2px; color: #3a3a3a; line-height: 2.2;
    }
    #telem .val { color: #666; }
    #telem .live { color: #ff9940; }
    .blue { color: #5599ff; }
    .red  { color: #ff5533; }

    #ctrl {
        position: absolute; bottom: 32px; right: 40px;
        font-size: 10px; letter-spacing: 2px; color: #2e2e2e;
        text-align: right; line-height: 2.4;
    }

    #ui::after {
        content: '';
        position: absolute; inset: 0;
        background: repeating-linear-gradient(
            0deg, transparent, transparent 2px,
            rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
        pointer-events: none;
    }

    @media (max-width: 700px) {
        #title { top: 20px; left: 20px; }
        #title h1 { font-size: 22px; letter-spacing: 6px; }
        #telem, #ctrl { bottom: 16px; font-size: 9px; line-height: 1.9; }
        #telem { left: 20px; }
        #ctrl  { right: 20px; }
    }
</style>

<script type="importmap">{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}</script>
</head>
<body>
<div id="ui">
    <div id="title">
        <h1>GARGANTUA</h1>
        <div class="sub">SIMULADOR DE BURACO NEGRO · EFEITOS RELATIVÍSTICOS</div>
    </div>
    <div id="telem">
        <div>MASSA <span class="val">6.5 × 10⁹ M☉</span></div>
        <div>RAIO SCHWARZSCHILD <span class="val">rₛ ≈ 19.5 AU</span></div>
        <div>ESFERA DE FÓTONS <span class="val">r = 1.5 rₛ</span></div>
        <div>ISCO <span class="val">r = 3 rₛ</span></div>
        <div>DOPPLER <span class="blue">■</span><span class="val"> azul</span> &ensp;<span class="red">■</span><span class="val"> vermelho</span></div>
        <div>DISTÂNCIA <span class="live" id="dist">—</span> &nbsp; FPS <span class="live" id="fps">—</span></div>
    </div>
    <div id="ctrl">
        <div>ARRASTAR → ORBITAR</div>
        <div>SCROLL → ZOOM</div>
        <div>DUPLO CLIQUE → RESET</div>
        <div>L → LENTE GRAVITACIONAL</div>
        <div>ESPAÇO → PAUSA</div>
    </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─────────────────────────────────────────────────────────────
//  CONSTANTES FÍSICAS (unidades da cena)
// ─────────────────────────────────────────────────────────────
const RS       = 3.0;            // raio de Schwarzschild = horizonte de eventos
const R_PHOTON = 1.5 * RS;       // 4.5  → esfera de fotões
const R_ISCO   = 3.0 * RS;       // 9.0  → órbita circular estável mais interna
const R_DISK_IN  = R_ISCO * 0.62; // disco começa perto (licença artística, estilo Interstellar)
const R_DISK_OUT = 17.0;

const IS_MOBILE   = matchMedia('(max-width: 700px)').matches;
const DISK_COUNT  = IS_MOBILE ? 25000 : 60000;
const STAR_COUNT  = IS_MOBILE ? 6000  : 16000;
const JET_COUNT   = IS_MOBILE ? 3500  : 10000;

// ─────────────────────────────────────────────────────────────
//  SETUP
// ─────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 6, 34);

const renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 6.5;
controls.maxDistance = 90;
controls.saveState();                       // guarda o estado inicial para o reset
renderer.domElement.addEventListener('dblclick', () => controls.reset());

// ─────────────────────────────────────────────────────────────
//  PÓS-PROCESSAMENTO
//  LensingShader: aproxima a deflexão da luz em torno do BH em
//  espaço-de-ecrã (α ∝ rₛ/b), desenha a sombra e o anel de fotões.
//  Substitui os "arcos" falsos de TorusGeometry do código original.
// ─────────────────────────────────────────────────────────────
const LensingShader = {
    uniforms: {
        tDiffuse:  { value: null },
        uCenter:   { value: new THREE.Vector2(0.5, 0.5) },
        uRadius:   { value: 0.1 },   // raio da sombra em unidades UV (eixo Y)
        uAspect:   { value: 1.0 },
        uStrength: { value: 1.0 },   // 0 = desligado
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2  uCenter;
        uniform float uRadius, uAspect, uStrength;
        varying vec2 vUv;

        void main() {
            vec2  d  = (vUv - uCenter) * vec2(uAspect, 1.0);
            float r  = length(d);
            float rs = max(uRadius, 1e-4);

            // Deflexão: forte junto ao horizonte, cai como 1/b longe dele.
            float defl = uStrength * 0.85 * rs * rs / (r * r + rs * rs * 0.30);
            defl = min(defl, r * 0.9);                 // evita atravessar o centro
            vec2  dir = d / max(r, 1e-5);
            vec2  uv  = vUv - dir * defl / vec2(uAspect, 1.0);

            vec3 col = texture2D(tDiffuse, clamp(uv, vec2(0.0), vec2(1.0))).rgb;

            // Sombra do buraco negro
            float shadow = smoothstep(rs * 0.97, rs * 1.05, r);
            col *= mix(1.0, shadow, uStrength);

            // Anel de fotões (borda brilhante da sombra)
            float ring = exp(-pow((r - rs * 1.04) / (rs * 0.05), 2.0));
            col += vec3(1.0, 0.74, 0.40) * ring * 0.30 * uStrength;

            gl_FragColor = vec4(col, 1.0);
        }`
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const lensPass = new ShaderPass(LensingShader);
composer.addPass(lensPass);

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.45, 0.75);
composer.addPass(bloom);

// ─────────────────────────────────────────────────────────────
//  CAMPO DE ESTRELAS
// ─────────────────────────────────────────────────────────────
{
    const pos = new Float32Array(STAR_COUNT * 3);
    const col = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = 300 + Math.random() * 250;
        pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = r * Math.cos(phi);

        const rnd = Math.random();
        if      (rnd < 0.08) { col[i*3]=.55; col[i*3+1]=.72; col[i*3+2]=1.00; } // gigantes azuis
        else if (rnd < 0.13) { col[i*3]=1.00; col[i*3+1]=.62; col[i*3+2]=.28; } // anãs laranja
        else                 { col[i*3]=.95;  col[i*3+1]=.95; col[i*3+2]=1.00; }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.9, sizeAttenuation: true, vertexColors: true,
        transparent: true, opacity: 0.9, depthWrite: false
    })));
}

// ─────────────────────────────────────────────────────────────
//  HORIZONTE DE EVENTOS (occlusor opaco)
// ─────────────────────────────────────────────────────────────
scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(RS, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
));

// ─────────────────────────────────────────────────────────────
//  CORONA
// ─────────────────────────────────────────────────────────────
const coronaMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `
        varying float vRim;
        void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vec3 vn = normalize(normalMatrix * normal);
            vec3 vd = normalize(-mv.xyz);
            vRim = pow(1.0 - abs(dot(vn, vd)), 2.8);
            gl_Position = projectionMatrix * mv;
        }`,
    fragmentShader: `
        uniform float time;
        varying float vRim;
        void main() {
            float flicker = 0.82 + 0.18 * sin(time * 5.3);
            vec3  color = mix(vec3(1.0, 0.45, 0.05), vec3(1.0, 0.9, 0.6), vRim * 0.6);
            gl_FragColor = vec4(color, vRim * 0.28 * flicker);
        }`,
    transparent: true, side: THREE.BackSide,
    blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(RS * 1.28, 32, 32), coronaMat));

// ─────────────────────────────────────────────────────────────
//  DISCO DE ACREÇÃO
//  Órbitas keplerianas + Doppler relativista COM beaming (D³)
//  + desvio para o vermelho gravitacional.
// ─────────────────────────────────────────────────────────────
const DISK_VERT = /* glsl */`
    uniform float time;
    uniform vec3  camPos;
    uniform float rs, rIn, rOut;

    attribute float initAngle;
    attribute float radius;
    attribute float vertOff;
    attribute vec3  baseCol;

    varying vec3  vCol;
    varying float vAlpha;

    void main() {
        // ω ∝ r^(-3/2)  (3ª lei de Kepler)
        float omega = 1.6 / pow(radius / rIn, 1.5);
        float angle = initAngle + omega * time;

        vec3 pos  = vec3(cos(angle) * radius, vertOff, sin(angle) * radius);
        vec3 tang = vec3(-sin(angle), 0.0, cos(angle));      // direção do movimento
        vec3 toCam = normalize(camPos - pos);
        float mu = clamp(dot(tang, toCam), -1.0, 1.0);       // +1 a aproximar, -1 a afastar

        // Velocidade orbital em fração de c:  β = sqrt(rs / 2r)
        float beta = min(sqrt(rs / (2.0 * radius)), 0.85);

        // Fator Doppler relativista D = sqrt(1-β²) / (1 - βμ)
        float D = sqrt(1.0 - beta * beta) / (1.0 - beta * mu);

        // Redshift gravitacional
        float g = sqrt(max(1.0 - rs / radius, 0.02));

        // "Beaming" relativista: brilho aparente ∝ D³ (assimetria do disco)
        float boost = clamp(pow(D * g, 3.0), 0.15, 2.2);

        // Gradiente de temperatura (mais quente e branco perto do interior)
        float heat = clamp(1.0 - (radius - rIn) / (rOut - rIn), 0.0, 1.0);

        vec3 col = baseCol;
        col = mix(col, vec3(1.35, 1.15, 0.92), heat * 0.55);

        // Cor Doppler: azul quando D > 1, vermelho quando D < 1
        float t = clamp((D - 1.0) * 1.4, -1.0, 1.0);
        if (t > 0.0) col = mix(col, vec3(0.55, 0.78, 1.00), t * 0.75);
        else         col = mix(col, vec3(1.00, 0.12, 0.02), -t * 0.75);

        vCol   = col * boost * 0.42;
        vAlpha = clamp((0.05 + heat * 0.14) * boost, 0.015, 0.40);

        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position  = projectionMatrix * mv;
        float depth  = max(-mv.z, 0.001);                     // evita gl_PointSize negativo
        gl_PointSize = clamp((1.0 + heat * 1.6) * (110.0 / depth), 1.0, 7.0);
    }
`;

const DISK_FRAG = /* glsl */`
    varying vec3  vCol;
    varying float vAlpha;
    void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(vCol, a);
    }
`;

function makeDisk(count, rMin, rMax, vSpread) {
    const angles  = new Float32Array(count);
    const radii   = new Float32Array(count);
    const voffs   = new Float32Array(count);
    const bcols   = new Float32Array(count * 3);
    const initPos = new Float32Array(count * 3);
    const c = new THREE.Color();

    for (let i = 0; i < count; i++) {
        const a    = Math.random() * Math.PI * 2;
        const r    = rMin + Math.pow(Math.random(), 1.5) * (rMax - rMin);
        const heat = 1 - (r - rMin) / (rMax - rMin);
        const v    = (Math.random() - 0.5) * vSpread * (0.15 + heat * 0.85);

        angles[i] = a; radii[i] = r; voffs[i] = v;

        c.setHSL(0.04 + Math.random() * 0.09, 1.0, 0.42 + heat * 0.30);
        bcols[i*3] = c.r; bcols[i*3+1] = c.g; bcols[i*3+2] = c.b;

        initPos[i*3] = Math.cos(a) * r; initPos[i*3+1] = v; initPos[i*3+2] = Math.sin(a) * r;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position',  new THREE.BufferAttribute(initPos, 3));
    geo.setAttribute('initAngle', new THREE.BufferAttribute(angles, 1));
    geo.setAttribute('radius',    new THREE.BufferAttribute(radii, 1));
    geo.setAttribute('vertOff',   new THREE.BufferAttribute(voffs, 1));
    geo.setAttribute('baseCol',   new THREE.BufferAttribute(bcols, 3));
    // Raio fixo por partícula → a esfera envolvente inicial é sempre válida
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), rMax + vSpread);

    const mat = new THREE.ShaderMaterial({
        uniforms: {
            time:   { value: 0 },
            camPos: { value: new THREE.Vector3() },
            rs:     { value: RS },
            rIn:    { value: rMin },
            rOut:   { value: rMax },
        },
        vertexShader: DISK_VERT,
        fragmentShader: DISK_FRAG,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    return new THREE.Points(geo, mat);
}

const disk = makeDisk(DISK_COUNT, R_DISK_IN, R_DISK_OUT, 0.9);
scene.add(disk);

// ─────────────────────────────────────────────────────────────
//  ANEL DE FOTÕES (geométrico, reforça o pós-processamento)
// ─────────────────────────────────────────────────────────────
{
    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(R_PHOTON, 0.04, 8, 256),
        new THREE.MeshBasicMaterial({
            color: 0xfff2dd, transparent: true, opacity: 0.45,
            blending: THREE.AdditiveBlending, depthWrite: false
        })
    );
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
}

// ─────────────────────────────────────────────────────────────
//  JATOS RELATIVISTAS
// ─────────────────────────────────────────────────────────────
function makeJet(dir) {
    const pos = new Float32Array(JET_COUNT * 3);
    const col = new Float32Array(JET_COUNT * 3);
    for (let i = 0; i < JET_COUNT; i++) {
        const t   = Math.pow(Math.random(), 0.55);
        const h   = dir * (RS * 1.1 + t * 32);
        const spr = (1 - t * 0.92) * 0.75;
        const ang = Math.random() * Math.PI * 2;
        const rr  = Math.random() * spr;
        pos[i*3]   = Math.cos(ang) * rr;
        pos[i*3+1] = h;
        pos[i*3+2] = Math.sin(ang) * rr;
        const b = 1 - t * 0.78;
        col[i*3] = 0.22 * b; col[i*3+1] = 0.55 * b; col[i*3+2] = b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.07, vertexColors: true, transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false
    }));
}
scene.add(makeJet(+1), makeJet(-1));

// ─────────────────────────────────────────────────────────────
//  HALO DE POEIRA
// ─────────────────────────────────────────────────────────────
{
    const N = IS_MOBILE ? 2000 : 5000;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
        const r = 20 + Math.random() * 26;
        const t = Math.random() * Math.PI * 2;
        const p = (Math.random() - 0.5) * Math.PI * 0.22;
        pos[i*3]   = r * Math.cos(t) * Math.cos(p);
        pos[i*3+1] = r * Math.sin(p);
        pos[i*3+2] = r * Math.sin(t) * Math.cos(p);
        col[i*3]   = 0.30 + Math.random() * 0.15;
        col[i*3+1] = 0.10 + Math.random() * 0.06;
        col[i*3+2] = 0.0;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.38, vertexColors: true, transparent: true, opacity: 0.11,
        blending: THREE.AdditiveBlending, depthWrite: false
    })));
}

// ─────────────────────────────────────────────────────────────
//  INTERAÇÃO
// ─────────────────────────────────────────────────────────────
let paused = false;
let lensing = 1.0;
addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
    if (e.code === 'KeyL')  { lensing = lensing > 0.5 ? 0.0 : 1.0; }
});

// ─────────────────────────────────────────────────────────────
//  LOOP
// ─────────────────────────────────────────────────────────────
const clock  = new THREE.Clock();
const center = new THREE.Vector3(0, 0, 0);
const proj   = new THREE.Vector3();
const elDist = document.getElementById('dist');
const elFps  = document.getElementById('fps');

let simTime = 0, frames = 0, fpsTimer = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);   // evita saltos ao voltar ao separador
    if (!paused) simTime += dt;

    disk.material.uniforms.time.value = simTime;
    disk.material.uniforms.camPos.value.copy(camera.position);
    coronaMat.uniforms.time.value = simTime;

    // Projetar o buraco negro para o espaço de ecrã (lente gravitacional)
    proj.copy(center).project(camera);
    const dist   = camera.position.distanceTo(center);
    const halfH  = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * dist;
    const behind = proj.z > 1;

    lensPass.uniforms.uCenter.value.set(proj.x * 0.5 + 0.5, proj.y * 0.5 + 0.5);
    lensPass.uniforms.uRadius.value = (RS / halfH) * 0.5;
    lensPass.uniforms.uAspect.value = camera.aspect;
    lensPass.uniforms.uStrength.value = behind ? 0.0 : lensing;

    controls.update();
    composer.render();

    // Telemetria
    frames++; fpsTimer += dt;
    if (fpsTimer >= 0.5) {
        elFps.textContent  = Math.round(frames / fpsTimer);
        elDist.textContent = (dist / RS).toFixed(1) + ' rₛ';
        frames = 0; fpsTimer = 0;
    }
}
animate();

// ─────────────────────────────────────────────────────────────
//  RESIZE
// ─────────────────────────────────────────────────────────────
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);   // já propaga setSize a todos os passes
});
</script>
</body>
</html>
