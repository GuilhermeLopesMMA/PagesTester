<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: a GBA-era "memory card" bench — sticky file bar, tab strip, one working panel; the Pokémon editor slides in as a sheet. Accent follows the loaded game. */
:root {
  --bg: #EEF2EF; --surface: #FFFFFF; --sunk: #E3E9E5; --ink: #15201B; --muted: #56655E; --line: #CFD9D3;
  --em: #0A7A53; --fr: #BF3329; --accent: var(--em); --on-accent: #FFFFFF;
  --good: #1D7442; --warn: #9A6200; --bad: #B3261E; --shiny: #A87A00;
  --f-display: 'Pixelify Sans', 'Courier New', monospace;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1412; --surface: #16201C; --sunk: #1D2925; --ink: #E5EDE9; --muted: #93A59D; --line: #2A3833;
  --em: #3DC48D; --fr: #F06A5F; --on-accent: #0E1412; --good: #5BCB86; --warn: #E0A93B; --bad: #F2776E; --shiny: #E8C14A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #16201C; --sunk: #1D2925; --ink: #E5EDE9; --muted: #93A59D; --line: #2A3833;
  --em: #3DC48D; --fr: #F06A5F; --on-accent: #0E1412; --good: #5BCB86; --warn: #E0A93B; --bad: #F2776E; --shiny: #E8C14A; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body[data-game="FRLG"] { --accent: var(--fr); }
* { box-sizing: border-box; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
.mono, input.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.cart { width: 30px; height: 34px; border-radius: 4px 4px 2px 2px; background: var(--accent); position: relative; flex: none; }
.cart::after { content: ""; position: absolute; left: 5px; right: 5px; top: 6px; height: 12px; background: var(--surface); border-radius: 2px; opacity: .85; }
.brand h1 { font-size: 20px; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }

/* banner */
.banner { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: var(--r); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.banner p { margin: 0; flex: 1 1 320px; min-width: 0; }
.banner.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }

/* summary strip */
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 14px 0 4px; color: var(--muted); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 700; }
.chip-game { font-family: var(--f-display); font-size: 13px; padding: 2px 8px; border-radius: 3px; background: var(--accent); color: var(--on-accent); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; border-bottom: 2px solid var(--line); }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-family: var(--f-display); font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 18px 0 60px; }

/* forms */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.field input, .field select, select.inp, input.inp { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.field input:focus, .field select:focus { border-color: var(--accent); }
.field .hint { font-size: 12px; color: var(--muted); }
.field.err input { border-color: var(--bad); }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.section + .section { margin-top: 16px; }
.section h2 { font-size: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }

/* party */
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.mon { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
.mon:hover { border-color: var(--accent); }
.mon .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mon .nm { font-family: var(--f-display); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mon .lv { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.mon .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.hpbar { height: 5px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); }
.mon.empty { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); min-height: 118px; font-family: var(--f-display); }
.types { display: flex; gap: 4px; }
.type { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--tc); background: color-mix(in srgb, var(--tc) 18%, var(--surface)); color: var(--ink); text-transform: uppercase; }
.star { color: var(--shiny); }
.egg { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--sunk); }

/* boxes */
.boxbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.boxbar .boxname { font-family: var(--f-display); font-size: 20px; min-width: 9ch; text-align: center; }
.boxgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; background: color-mix(in srgb, var(--accent) 10%, var(--sunk)); padding: 8px; border-radius: 8px; }
.cell { aspect-ratio: 1 / 1; max-width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 2px; min-width: 0; overflow: hidden; }
.cell:hover { border-color: var(--accent); }
.cell .cn { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .cl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.cell.empty { background: transparent; border-style: dashed; color: var(--muted); font-size: 18px; }
.cell .dex { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }

/* bag */
.pockets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; background: var(--surface); cursor: pointer; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.items-table select { min-width: 200px; }
.items-table input { width: 90px; }

/* editor sheet */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 20px; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.sheet footer { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.sheet footer .spacer { flex: 1; }
.stats td, .stats th { padding: 4px 6px; }
.stats input { width: 58px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); text-align: right; font-family: var(--f-mono); }
.stats .final { font-weight: 700; }
.plus { color: var(--good); } .minus { color: var(--bad); }
.moves { display: grid; grid-template-columns: minmax(0, 1fr) 92px 64px; gap: 8px; align-items: center; }
.moves .pp { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: right; }
.ev-total { font-family: var(--f-mono); font-size: 13px; }
.ev-total.over { color: var(--bad); font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.errmsg { color: var(--bad); font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; max-width: calc(100% - 32px); font-size: 14px; }
.drop { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--accent) 25%, transparent); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 28px; color: var(--ink); pointer-events: none; }
details.help summary { cursor: pointer; font-weight: 700; }
details.help ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; max-width: 70ch; }
@media (max-width: 560px) {
  .moves { grid-template-columns: minmax(0, 1fr) 80px; }
  .moves .pp { grid-column: 2; }
  .boxgrid { gap: 4px; padding: 6px; }
  .cell .dex { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

// minimal store-only zip (the artifact viewer cannot hand out .sav directly)
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(name, data) {
  const nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  const out = new Uint8Array(30 + nm.length + sz + 46 + nm.length + 22), w16 = G3.w16, w32 = G3.w32;
  let o = 0;
  w32(out, 0, 0x04034b50); w16(out, 4, 20); w16(out, 6, 0x0800); w16(out, 8, 0); w16(out, 10, 0); w16(out, 12, 0x21);
  w32(out, 14, crc); w32(out, 18, sz); w32(out, 22, sz); w16(out, 26, nm.length); w16(out, 28, 0);
  out.set(nm, 30); out.set(data, 30 + nm.length); o = 30 + nm.length + sz;
  const cd = o;
  w32(out, o, 0x02014b50); w16(out, o + 4, 20); w16(out, o + 6, 20); w16(out, o + 8, 0x0800); w16(out, o + 10, 0); w16(out, o + 12, 0); w16(out, o + 14, 0x21);
  w32(out, o + 16, crc); w32(out, o + 20, sz); w32(out, o + 24, sz); w16(out, o + 28, nm.length); w16(out, o + 30, 0); w16(out, o + 32, 0);
  w16(out, o + 34, 0); w16(out, o + 36, 0); w32(out, o + 38, 0); w32(out, o + 42, 0); out.set(nm, o + 46); o += 46 + nm.length;
  w32(out, o, 0x06054b50); w16(out, o + 4, 0); w16(out, o + 6, 0); w16(out, o + 8, 1); w16(out, o + 10, 1);
  w32(out, o + 12, o - cd); w32(out, o + 16, cd); w16(out, o + 20, 0);
  return out;
}

function applyTrainer() {
  const sv = S.save, old = sv.trainer(), oldOT = otOf();
  const v = id => $('#' + id).value, n = (id, max) => Math.max(0, Math.min(max, Math.floor(+v(id) || 0)));
  const name = v('t-name');
  if (!name || !G3.textOk(name)) { $('#t-err').textContent = 'Nome vazio ou com caracteres que o jogo não tem.'; return; }
  const rival = $('#t-rival') ? v('t-rival') : undefined;
  if (rival !== undefined && !G3.textOk(rival)) { $('#t-err').textContent = 'Nome do rival com caracteres inválidos.'; return; }
  const upd = { name, gender: +v('t-gender'), tid: n('t-tid', 65535), sid: n('t-sid', 65535), money: n('t-money', 999999), coins: n('t-coins', 9999), hours: n('t-h', 999), minutes: n('t-m', 59), seconds: n('t-s', 59) };
  if (rival !== undefined) upd.rival = rival;
  sv.setTrainer(upd);
  const newOT = otOf();
  let moved = 0;
  if (newOT !== oldOT && $('#t-fixot').checked) {
    const fix = m => {
      if (!m || m.otid !== oldOT) return m;
      const wasShiny = G3.isShiny(m.pid, m.otid), nature = m.pid % 25, gender = G3.genderOf(m.species, m.pid);
      m.otid = newOT; if (m.otName === old.name) m.otName = name;
      if (G3.isShiny(m.pid, m.otid) !== wasShiny) m.pid = G3.rollPid(m, { nature, shiny: wasShiny, gender: gender === '-' ? undefined : gender });
      moved++; return m;
    };
    const p = sv.party().map(m => { const hp = m.hp; const r = fix(m); r.hp = hp; return r; }); sv.setParty(p);
    for (let b = 0; b < 14; b++) for (let s = 0; s < 30; s++) { const m = sv.boxMon(b, s); if (m && m.otid === oldOT) sv.setBoxMon(b, s, fix(m)); }
  }
  setDirty(); render(); toast(moved ? `Treinador atualizado. ${moved} Pokémon passaram para o novo ID.` : 'Treinador atualizado.');
}

// ---------- Pokémon editor ----------
function openEditor(where, idx, isNew) {
  const sv = S.save;
  let m;
  if (isNew) {
    const sp = sv.game.id === 'E' ? D.species.indexOf('Treecko') : D.species.indexOf('Bulbasaur');
    m = G3.newMon(sv, sp, 5);
    m.ability = 0; m.pid = G3.rollPid(m, { nature: (Math.random() * 25) | 0 });
    m.moves = [findName(D.moves, sp === D.species.indexOf('Treecko') ? 'Pound' : 'Tackle'), 0, 0, 0];
    m.pp = m.moves.map(x => x ? D.pp[x] : 0);
  } else {
    m = where === 'party' ? sv.party()[idx] : sv.boxMon(S.box, idx);
  }
  S.edit = { where, idx, box: S.box, isNew: !!isNew, m: structuredClone(m), err: '' };
  renderEditor();
}
function closeEditor() { S.edit = null; $('#sheet-root').innerHTML = ''; }
function renderEditor() {
  const E = S.edit, m = E.m, inf = D.info[m.species];
  const lvl = G3.levelFromExp(m.species, m.exp);
  const shiny = G3.isShiny(m.pid, m.otid), gender = G3.genderOf(m.species, m.pid);
  const ab = inf.a;
  const where = E.where === 'party' ? 'Equipa' : `Caixa ${E.box + 1} · posição ${E.idx + 1}`;
  const otTid = m.otid & 0xFFFF, otSid = m.otid >>> 16;
  $('#sheet-root').innerHTML = `<div class="scrim" data-eact="close"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="Editar Pokémon">
    <header><h2>${esc(E.isNew ? 'Novo Pokémon' : (m.isEgg ? 'Ovo' : m.nickname))}${shiny ? ' <span class="star">★</span>' : ''}</h2><span class="muted" style="font-size:13px">${where}</span><button class="btn ghost" data-eact="close" aria-label="Fechar">✕</button></header>
    <div class="body">
      <div class="section">
        <div class="grid">
          <div class="field" style="grid-column:1/-1"><label for="e-species">Espécie</label><select id="e-species">${SPECIES_OPTS}</select></div>
          <div class="field"><label for="e-nick">Alcunha</label><input id="e-nick" maxlength="10" value="${esc(m.nickname)}"></div>
          <div class="field"><label for="e-level">Nível</label><input id="e-level" class="mono" type="number" min="1" max="100" value="${lvl}"></div>
          <div class="field"><label for="e-nature">Natureza</label><select id="e-nature">${NATURES_PT.map((n, i) => { const t = G3.NATURE_TABLE[i]; const up = t.indexOf(1), dn = t.indexOf(-1); return `<option value="${i}"${i === m.pid % 25 ? ' selected' : ''}>${n}${up >= 0 ? ` (+${STAT_SHORT[up + 1]} −${STAT_SHORT[dn + 1]})` : ''}</option>`; }).join('')}</select></div>
          <div class="field"><label for="e-gender">Género</label><select id="e-gender"${gender === '-' || inf.g === 0 || inf.g === 254 ? ' disabled' : ''}>
            ${gender === '-' ? '<option>Sem género</option>' : `<option value="M"${gender === 'M' ? ' selected' : ''}>Macho ♂</option><option value="F"${gender === 'F' ? ' selected' : ''}>Fêmea ♀</option>`}</select></div>
          <div class="field"><label for="e-ability">Habilidade</label><select id="e-ability"><option value="0"${m.ability ? '' : ' selected'}>${esc(D.abilities[ab[0]])}</option>${ab[1] ? `<option value="1"${m.ability ? ' selected' : ''}>${esc(D.abilities[ab[1]])}</option>` : ''}</select></div>
          <div class="field"><label for="e-item">Item segurado</label><select id="e-item">${HOLD_OPTS}</select></div>
          <div class="field"><label for="e-friend">Amizade</label><input id="e-friend" class="mono" type="number" min="0" max="255" value="${m.friendship}"></div>
          <div class="field"><label for="e-ball">Ball</label><select id="e-ball">${BALL_OPTS}</select></div>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="e-shiny"${shiny ? ' checked' : ''}> Shiny</label>
          <label class="check"><input type="checkbox" id="e-rus"${m.pokerus ? ' checked' : ''}> Pokérus</label>
          ${m.isEgg ? '<button class="btn sm" data-eact="hatch">Chocar ovo</button>' : ''}
          <span class="muted mono" style="font-size:12px;margin-left:auto">PID <input id="e-pid" class="inp mono" style="width:11ch;display:inline-block;padding:3px 6px" value="${m.pid.toString(16).toUpperCase().padStart(8, '0')}" aria-label="PID em hexadecimal"></span>
        </div>
        <p class="note">Natureza, género e shiny vêm todos do PID. Mudar um gera um PID novo que mantém os outros dois.</p>
      </div>

      <div class="section">
        <h2>Golpes</h2>
        <div class="moves">
          ${[0, 1, 2, 3].map(i => `<select class="inp" id="e-m${i}" aria-label="Golpe ${i + 1}">${MOVE_OPTS}</select>
            <select class="inp" id="e-u${i}" aria-label="PP Ups do golpe ${i + 1}">${[0, 1, 2, 3].map(u => `<option value="${u}"${upsOf(m, i) === u ? ' selected' : ''}>PP Up ×${u}</option>`).join('')}</select>
            <span class="pp" id="e-pp${i}"></span>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="row" style="justify-content:space-between"><h2>Stats</h2>
          <div class="row"><button class="btn sm" data-eact="iv-max">IVs 31</button><button class="btn sm" data-eact="ev-clear">Limpar EVs</button><span class="ev-total" id="e-evt"></span></div></div>
        <div class="tablewrap"><table class="stats"><thead><tr><th>Stat</th><th class="num">Base</th><th class="num">IV</th><th class="num">EV</th><th class="num">Final</th></tr></thead><tbody id="e-stats">
          ${[0, 1, 2, 3, 4, 5].map(i => `<tr><td id="e-sn${i}">${STAT[i]}</td><td class="num" id="e-b${i}"></td>
            <td class="num"><input id="e-iv${i}" type="number" min="0" max="31" value="${m.ivs[i]}" aria-label="IV ${STAT[i]}"></td>
            <td class="num"><input id="e-ev${i}" type="number" min="0" max="255" value="${m.evs[i]}" aria-label="EV ${STAT[i]}"></td>
            <td class="num final" id="e-f${i}"></td></tr>`).join('')}
        </tbody></table></div>
      </div>

      <div class="section">
        <h2>Origem</h2>
        <div class="grid">
          <div class="field"><label for="e-ot">Nome do OT</label><input id="e-ot" maxlength="7" value="${esc(m.otName)}"></div>
          <div class="field"><label for="e-ottid">TID do OT</label><input id="e-ottid" class="mono" type="number" min="0" max="65535" value="${otTid}"></div>
          <div class="field"><label for="e-otsid">SID do OT</label><input id="e-otsid" class="mono" type="number" min="0" max="65535" value="${otSid}"></div>
          <div class="field"><label for="e-otg">Género do OT</label><select id="e-otg"><option value="0"${m.otGender ? '' : ' selected'}>Masculino</option><option value="1"${m.otGender ? ' selected' : ''}>Feminino</option></select></div>
          <div class="field"><label for="e-metlv">Nível de captura</label><input id="e-metlv" class="mono" type="number" min="0" max="100" value="${m.metLevel}"><span class="hint">0 = chocou de ovo</span></div>
          <div class="field"><label for="e-metloc">Local (índice)</label><input id="e-metloc" class="mono" type="number" min="0" max="255" value="${m.metLoc}"></div>
        </div>
        <div class="row"><button class="btn sm" data-eact="ot-me">Usar os meus dados de treinador</button><span class="note">Com OT diferente o Pokémon conta como trocado e pode desobedecer.</span></div>
      </div>
    </div>
    <footer>
      <span class="errmsg" id="e-err" style="flex-basis:100%">${esc(E.err || '')}</span>
      ${E.isNew ? '' : `<button class="btn danger" data-eact="delete">Apagar</button>`}
      ${!E.isNew && E.where === 'party' ? '<button class="btn" data-eact="to-pc">Enviar para o PC</button>' : ''}
      ${!E.isNew && E.where === 'box' ? '<button class="btn" data-eact="to-party">Mover para a equipa</button>' : ''}
      ${!E.isNew ? '<button class="btn" data-eact="clone">Clonar para o PC</button>' : ''}
      <span class="spacer"></span>
      <button class="btn" data-eact="close">Cancelar</button>
      <button class="btn primary" data-eact="save">${E.isNew ? 'Criar' : 'Guardar'}</button>
    </footer>
  </aside>`;
  $('#e-species').value = m.species; $('#e-item').value = m.item; $('#e-ball').value = m.ball || 4;
  if (!$('#e-item').value) { const o = document.createElement('option'); o.value = m.item; o.textContent = D.items[m.item] || 'Item ' + m.item; $('#e-item').append(o); $('#e-item').value = m.item; }
  for (let i = 0; i < 4; i++) $('#e-m' + i).value = m.moves[i];
  refreshDerived();
  const sheet = $('.sheet'); sheet.addEventListener('change', onEditorChange); sheet.addEventListener('input', onEditorInput);
  $('#e-species').focus({ preventScroll: true });
}
const num = (id, lo, hi) => Math.max(lo, Math.min(hi, Math.floor(+$('#' + id).value || 0)));
function readEditor() {
  const m = S.edit.m;
  m.nickname = $('#e-nick').value; m.item = +$('#e-item').value; m.friendship = num('e-friend', 0, 255); m.ball = +$('#e-ball').value;
  m.ability = D.info[m.species].a[1] ? +$('#e-ability').value : 0;
  m.pokerus = $('#e-rus').checked ? (m.pokerus || 0x13) : 0;
  let bonus = 0;
  for (let i = 0; i < 4; i++) { m.moves[i] = +$('#e-m' + i).value; const u = m.moves[i] ? +$('#e-u' + i).value : 0; bonus |= u << (i * 2); }
  m.ppBonuses = bonus;
  for (let i = 0; i < 6; i++) { m.ivs[i] = num('e-iv' + i, 0, 31); m.evs[i] = num('e-ev' + i, 0, 255); }
  m.otName = $('#e-ot').value; m.otGender = +$('#e-otg').value; m.metLevel = num('e-metlv', 0, 100); m.metLoc = num('e-metloc', 0, 255);
  m.otid = ((num('e-otsid', 0, 65535) << 16) | num('e-ottid', 0, 65535)) >>> 0;
  m.exp = G3.expFor(D.info[m.species].r, num('e-level', 1, 100));
}
function refreshDerived() {
  const m = S.edit.m, inf = D.info[m.species], lvl = G3.levelFromExp(m.species, m.exp);
  const st = G3.calcStats(m, lvl), nat = G3.NATURE_TABLE[m.pid % 25];
  for (let i = 0; i < 6; i++) {
    $('#e-b' + i).textContent = inf.b[i];
    $('#e-f' + i).textContent = st[i];
    const eff = i ? nat[i - 1] : 0;
    $('#e-sn' + i).innerHTML = STAT[i] + (eff > 0 ? ' <span class="plus">▲</span>' : eff < 0 ? ' <span class="minus">▼</span>' : '');
  }
  const tot = m.evs.reduce((a, b) => a + b, 0), evt = $('#e-evt');
  evt.textContent = `EVs ${tot}/510`; evt.classList.toggle('over', tot > 510);
  for (let i = 0; i < 4; i++) $('#e-pp' + i).textContent = m.moves[i] ? `${maxPP(m.moves[i], upsOf(m, i))} PP` : '';
  $('#e-pid').value = m.pid.toString(16).toUpperCase().padStart(8, '0');
}
function pidWish(override = {}) {
  const m = S.edit.m;
  const g = G3.genderOf(m.species, m.pid);
  return Object.assign({ nature: m.pid % 25, shiny: G3.isShiny(m.pid, m.otid), gender: g === '-' ? undefined : g }, override);
}
function onEditorInput(e) {
  if (/^e-(iv|ev|level)/.test(e.target.id)) { readEditor(); refreshDerived(); }
}
function onEditorChange(e) {
  const id = e.target.id, m = S.edit.m;
  if (id === 'e-species') {
    const oldName = D.species[m.species], lvl = G3.levelFromExp(m.species, m.exp);
    readEditor();
    const sp = +e.target.value, wish = pidWish();
    m.species = sp; m.exp = G3.expFor(D.info[sp].r, lvl);
    if (!m.nickname || m.nickname.toUpperCase() === oldName.toUpperCase()) m.nickname = D.species[sp].slice(0, 10);
    if (!D.info[sp].a[1]) m.ability = 0;
    if (wish.gender && G3.genderOf(sp, m.pid) !== wish.gender && G3.genderOf(sp, m.pid) !== '-') m.pid = G3.rollPid(m, wish);
    renderEditor(); return;
  }
  if (id === 'e-nature' || id === 'e-gender' || id === 'e-shiny') {
    readEditor();
    const o = id === 'e-nature' ? { nature: +e.target.value } : id === 'e-gender' ? { gender: e.target.value } : { shiny: e.target.checked };
    m.pid = G3.rollPid(m, pidWish(o)); renderEditor(); return;
  }
  if (id === 'e-pid') {
    const v = parseInt(e.target.value, 16);
    if (Number.isFinite(v) && /^[0-9a-f]{1,8}$/i.test(e.target.value.trim())) { readEditor(); m.pid = v >>> 0; renderEditor(); }
    else { e.target.value = m.pid.toString(16).toUpperCase().padStart(8, '0'); }
    return;
  }
  if (/^e-(ottid|otsid)$/.test(id)) {
    const wish = pidWish(); readEditor();
    if (G3.isShiny(m.pid, m.otid) !== wish.shiny) m.pid = G3.rollPid(m, wish);
    renderEditor(); return;
  }
  if (/^e-[mu]\d$/.test(id)) {
    readEditor();
    const i = +id.slice(-1); m.pp[i] = m.moves[i] ? maxPP(m.moves[i], upsOf(m, i)) : 0;
    refreshDerived(); return;
  }
  readEditor(); refreshDerived();
}
$('#sheet-root').addEventListener('click', e => {
  const b = e.target.closest('[data-eact]'); if (!b || !S.edit) return;
  const act = b.dataset.eact, E = S.edit, m = E.m, sv = S.save;
  if (act === 'close') return closeEditor();
  if (act === 'iv-max') { for (let i = 0; i < 6; i++) $('#e-iv' + i).value = 31; readEditor(); refreshDerived(); return; }
  if (act === 'ev-clear') { for (let i = 0; i < 6; i++) $('#e-ev' + i).value = 0; readEditor(); refreshDerived(); return; }
  if (act === 'ot-me') {
    const t = sv.trainer(); $('#e-ot').value = t.name; $('#e-ottid').value = t.tid; $('#e-otsid').value = t.sid; $('#e-otg').value = t.gender;
    const wish = pidWish(); readEditor(); if (G3.isShiny(m.pid, m.otid) !== wish.shiny) m.pid = G3.rollPid(m, wish); renderEditor(); return;
  }
  if (act === 'hatch') { readEditor(); m.isEgg = 0; m.nickname = D.species[m.species].slice(0, 10); m.language = sv.language; m.friendship = 120; m.metLevel = 0; renderEditor(); return; }
  if (act === 'delete') {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Confirmar apagar'; return; }
    if (E.where === 'party') {
      const p = sv.party(); if (p.length <= 1) { $('#e-err').textContent = 'A equipa precisa de pelo menos um Pokémon.'; return; }
      p.splice(E.idx, 1); sv.setParty(p);
    } else sv.setBoxMon(E.box, E.idx, null);
    closeEditor(); setDirty(); render(); toast('Pokémon apagado.'); return;
  }
  // everything below commits the editor state
  readEditor();
  const errs = [];
  if (!m.isEgg && (!m.nickname || !G3.textOk(m.nickname))) errs.push('Alcunha vazia ou com caracteres que o jogo não tem.');
  if (!m.otName || !G3.textOk(m.otName)) errs.push('Nome do OT vazio ou inválido.');
  if (m.evs.reduce((a, c) => a + c, 0) > 510) errs.push('EVs acima de 510 — o jogo não deixa chegar aí.');
  if (!m.moves.some(Boolean)) errs.push('Precisa de pelo menos um golpe.');
  if (errs.length) { $('#e-err').textContent = errs.join(' '); return; }
  // compact moves and set PP
  const mv = []; for (let i = 0; i < 4; i++) if (m.moves[i]) mv.push([m.moves[i], upsOf(m, i)]);
  while (mv.length < 4) mv.push([0, 0]);
  m.moves = mv.map(x => x[0]); m.ppBonuses = mv.reduce((a, x, i) => a | (x[1] << (i * 2)), 0);
  m.pp = m.moves.map((x, i) => x ? maxPP(x, upsOf(m, i)) : 0);
  m.hp = undefined;
  if (m.status === undefined) m.status = 0;
  if (m.mail === undefined) m.mail = 0xFF;
  if (!m.isEgg && D.nat[m.species]) sv.setDex(D.nat[m.species], 1, 1);
  const firstFree = () => { for (let bx = 0; bx < 14; bx++) for (let s = 0; s < 30; s++) if (!sv.boxMon(bx, s)) return [bx, s]; return null; };
  if (act === 'save') {
    if (E.where === 'party') { const p = sv.party(); p[E.idx] = m; sv.setParty(p); }
    else sv.setBoxMon(E.box, E.idx, m);
    closeEditor(); setDirty(); render(); toast(E.isNew ? 'Pokémon criado.' : 'Guardado.'); return;
  }
  if (act === 'to-pc' || act === 'clone') {
    const f = firstFree(); if (!f) { $('#e-err').textContent = 'O PC está cheio.'; return; }
    if (act === 'to-pc') {
      const p = sv.party(); if (p.length <= 1) { $('#e-err').textContent = 'A equipa precisa de pelo menos um Pokémon.'; return; }
      p.splice(E.idx, 1); sv.setParty(p);
    } else if (E.where === 'party') { const p = sv.party(); p[E.idx] = m; sv.setParty(p); } else sv.setBoxMon(E.box, E.idx, m);
    sv.setBoxMon(f[0], f[1], structuredClone(m));
    closeEditor(); setDirty(); render(); toast(`${act === 'clone' ? 'Clonado' : 'Enviado'} para a Caixa ${f[0] + 1}, posição ${f[1] + 1}.`); return;
  }
  if (act === 'to-party') {
    const p = sv.party(); if (p.length >= 6) { $('#e-err').textContent = 'A equipa já tem 6.'; return; }
    p.push(m); sv.setParty(p); sv.setBoxMon(E.box, E.idx, null);
    closeEditor(); setDirty(); render(); toast('Movido para a equipa.'); return;
  }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && S.edit) closeEditor(); });
addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

// boot with demo
S.save = buildDemo(); S.demo = true;
render();
})();
</script>
