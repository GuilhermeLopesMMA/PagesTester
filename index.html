<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Principal</title>

    <link rel="shortcut icon" href="media/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg-color: #0f1a14;
        --bg-color-2: #0a120d;
        --card-bg: #16261d;
        --card-bg-hover: #1c3025;
        --text-main: #f1fdf7;
        --text-muted: #8fac9c;
        --accent: #34d399;
        --accent-2: #10b981;
        --accent-gradient: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: radial-gradient(circle at 50% 20%, var(--bg-color) 0%, var(--bg-color-2) 100%);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Glow de fundo animado pelo GSAP */
      .glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(52,211,153,0.15) 0%, rgba(52,211,153,0) 70%);
        top: -200px;
        left: -200px;
        pointer-events: none;
        filter: blur(10px);
      }

      .menu-container {
        width: 100%;
        max-width: 620px;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        letter-spacing: -0.05em;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 2.5rem;
        opacity: 0;
      }

      ul {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.75rem 1.25rem;
      }

      li {
        opacity: 0;
      }

      .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.85rem;
        position: relative;
        padding-top: 0.5rem;
      }

      /* Folder icon built from stacked CSS shapes */
      .folder-icon {
        position: relative;
        width: 64px;
        height: 48px;
      }

      .folder-back {
        position: absolute;
        inset: 0;
        top: 4px;
        background: var(--card-bg-hover);
        border-radius: 4px 8px 8px 8px;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .folder-back::before {
        content: "";
        position: absolute;
        top: -7px;
        left: 0;
        width: 42%;
        height: 10px;
        background: var(--card-bg-hover);
        border-radius: 6px 6px 0 0;
      }

      .folder-front {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34px;
        background: var(--card-bg);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 3px 8px 8px 8px;
        transform-origin: bottom;
        transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), background 0.3s ease, box-shadow 0.3s ease;
        z-index: 1;
      }

      .menu-item:not(.disabled):hover .folder-front {
        transform: rotateX(-35deg) translateY(-3px);
        background: var(--card-bg-hover);
        box-shadow: 0 10px 18px -6px rgba(0,0,0,0.5), 0 0 0 1px rgba(52,211,153,0.25);
      }

      .menu-item:not(.disabled):hover .folder-back {
        box-shadow: 0 0 0 1px rgba(52,211,153,0.15);
      }

      .menu-item:not(.disabled):hover .folder-back::after {
        content: "";
        position: absolute;
        inset: 6px 8px;
        top: 8px;
        border-radius: 3px;
        background: linear-gradient(160deg, rgba(52,211,153,0.16), transparent 70%);
      }

      .folder-label {
        transition: color 0.25s ease;
      }

      .menu-item:not(.disabled):hover .folder-label {
        color: var(--accent);
      }

      .menu-item.disabled {
        color: var(--text-muted);
        opacity: 0.5;
        cursor: not-allowed;
      }

      .menu-item.disabled .folder-front,
      .menu-item.disabled .folder-back {
        border-style: dashed;
      }

      @media (max-width: 480px) {
        ul { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>

    <div class="glow" id="glow"></div>

    <div class="menu-container">
      <h1 id="menu-title">Menu Principal</h1>
      <p class="subtitle" id="menu-subtitle">Escolhe um projeto para abrir</p>
      <ul id="menu-list">
        <li><a class="menu-item" href="sub-pages/budget_simulator.html">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">Budget Simulator</span>
        </a></li>
        <li><a class="menu-item" href="sub-pages/gargantua.html">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">Gargantua Simulator</span>
        </a></li>
        <li><a class="menu-item" href="sub-pages/quitina.html">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">Quitina</span>
        </a></li>
        <li><a class="menu-item" href="sub-pages/civ.html">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">CIV</span>
        </a></li>
        <li><a class="menu-item" href="sub-pages/txt_viewer.html">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">.TXT Viewer</span>
        </a></li>
        <li><a class="menu-item disabled" href="#">
          <span class="folder-icon"><span class="folder-back"></span><span class="folder-front"></span></span>
          <span class="folder-label">To Add</span>
        </a></li>
      </ul>
    </div>

    <!-- GSAP via CDN correto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {

        // Timeline de entrada
        const tl = gsap.timeline();

        tl.to("#glow", {
          opacity: 1,
          duration: 1.5,
          ease: "power2.out"
        })
        .to("#menu-title", {
          opacity: 1,
          y: 0,
          duration: 1,
          ease: "power4.out"
        }, "-=1.2")
        .to("#menu-subtitle", {
          opacity: 1,
          duration: 0.8,
          ease: "power2.out"
        }, "-=0.6")
        .to("#menu-list li", {
          opacity: 1,
          y: 0,
          duration: 0.8,
          stagger: 0.12,
          ease: "power3.out"
        }, "-=0.4");

        // Estado inicial (antes de a timeline correr)
        gsap.set("#menu-title", { y: -20 });
        gsap.set("#menu-list li", { y: 20 });
        gsap.set("#glow", { opacity: 0 });

        // Glow segue o rato lentamente (parallax subtil)
        const glow = document.getElementById("glow");
        const xTo = gsap.quickTo(glow, "x", { duration: 1.2, ease: "power3.out" });
        const yTo = gsap.quickTo(glow, "y", { duration: 1.2, ease: "power3.out" });

        window.addEventListener('mousemove', (e) => {
          xTo(e.clientX - 300);
          yTo(e.clientY - 300);
        });

        // Hover nos cards: scale + brilho a seguir o cursor
        const items = document.querySelectorAll('.menu-item:not(.disabled)');

        items.forEach(item => {
          item.addEventListener('mouseenter', () => {
            gsap.to(item, {
              y: -3,
              duration: 0.3,
              ease: "power2.out"
            });
          });

          item.addEventListener('mouseleave', () => {
            gsap.to(item, {
              y: 0,
              duration: 0.3,
              ease: "power2.out"
            });
          });
        });

      });
    </script>
  </body>
</html>
