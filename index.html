<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Principal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg-color: #0f172a;
        --bg-color-2: #0a1120;
        --card-bg: #1e293b;
        --card-bg-hover: #243249;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #3b82f6;
        --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: radial-gradient(circle at 50% 20%, var(--bg-color) 0%, var(--bg-color-2) 100%);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Glow de fundo animado pelo GSAP */
      .glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(56,189,248,0) 70%);
        top: -200px;
        left: -200px;
        pointer-events: none;
        filter: blur(10px);
      }

      .menu-container {
        width: 100%;
        max-width: 480px;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        letter-spacing: -0.05em;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 2.5rem;
        opacity: 0;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      li {
        opacity: 0;
      }

      .menu-item {
        display: block;
        text-decoration: none;
        color: var(--text-main);
        background-color: var(--card-bg);
        padding: 1.25rem 1.5rem;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1.1rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }

      /* Brilho que segue o rato, criado via GSAP quickTo */
      .menu-item::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(180px circle at var(--x, 50%) var(--y, 50%), rgba(56,189,248,0.18), transparent 70%);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: -1;
      }

      .menu-item:hover::before {
        opacity: 1;
      }

      .menu-item.disabled {
        color: var(--text-muted);
        opacity: 0.6;
        border-style: dashed;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>

    <div class="glow" id="glow"></div>

    <div class="menu-container">
      <h1 id="menu-title">Menu Principal</h1>
      <p class="subtitle" id="menu-subtitle">Escolhe um projeto para abrir</p>
      <ul id="menu-list">
        <li><a class="menu-item" href="sub-pages/budget_simulator.html">Budget Simulator</a></li>
        <li><a class="menu-item" href="sub-pages/gargantua.html">Gargantua Simulator</a></li>
        <li><a class="menu-item" href="sub-pages/quitina.html">Quitina</a></li>
        <li><a class="menu-item" href="sub-pages/civ.html">CIV</a></li>
        <li><a class="menu-item disabled" href="#">To Add</a></li>
      </ul>
    </div>

    <!-- GSAP via CDN correto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {

        // Timeline de entrada
        const tl = gsap.timeline();

        tl.to("#glow", {
          opacity: 1,
          duration: 1.5,
          ease: "power2.out"
        })
        .to("#menu-title", {
          opacity: 1,
          y: 0,
          duration: 1,
          ease: "power4.out"
        }, "-=1.2")
        .to("#menu-subtitle", {
          opacity: 1,
          duration: 0.8,
          ease: "power2.out"
        }, "-=0.6")
        .to("#menu-list li", {
          opacity: 1,
          y: 0,
          duration: 0.8,
          stagger: 0.12,
          ease: "power3.out"
        }, "-=0.4");

        // Estado inicial (antes de a timeline correr)
        gsap.set("#menu-title", { y: -20 });
        gsap.set("#menu-list li", { y: 20 });
        gsap.set("#glow", { opacity: 0 });

        // Glow segue o rato lentamente (parallax subtil)
        const glow = document.getElementById("glow");
        const xTo = gsap.quickTo(glow, "x", { duration: 1.2, ease: "power3.out" });
        const yTo = gsap.quickTo(glow, "y", { duration: 1.2, ease: "power3.out" });

        window.addEventListener('mousemove', (e) => {
          xTo(e.clientX - 300);
          yTo(e.clientY - 300);
        });

        // Hover nos cards: scale + brilho a seguir o cursor
        const items = document.querySelectorAll('.menu-item:not(.disabled)');

        items.forEach(item => {
          item.addEventListener('mouseenter', () => {
            gsap.to(item, {
              scale: 1.03,
              duration: 0.3,
              ease: "power2.out"
            });
          });

          item.addEventListener('mouseleave', () => {
            gsap.to(item, {
              scale: 1,
              duration: 0.3,
              ease: "power2.out"
            });
          });

          item.addEventListener('mousemove', (e) => {
            const rect = item.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            item.style.setProperty('--x', `${x}%`);
            item.style.setProperty('--y', `${y}%`);
          });

          // Pequeno "press" ao clicar
          item.addEventListener('mousedown', () => {
            gsap.to(item, { scale: 0.97, duration: 0.15, ease: "power2.out" });
          });
          item.addEventListener('mouseup', () => {
            gsap.to(item, { scale: 1.03, duration: 0.15, ease: "power2.out" });
          });
        });

      });
    </script>
  </body>
</html>
